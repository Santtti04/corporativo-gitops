---
- name: Crear directorio de la aplicacion
  file:
    path: /tmp/corporativo-app
    state: directory
    mode: '0755'

- name: Desplegar archivo de configuracion
  copy:
    content: |
      # Configuracion Corporativa GitOps
      VERSION=1.0.0
      ENTORNO=produccion
      PIPELINE=Jenkins + Terraform + Ansible
    dest: /tmp/corporativo-app/config.env

- name: Registrar despliegue exitoso
  copy:
    content: "DESPLIEGUE EXITOSO - {{ ansible_date_time.iso8601 | default('OK') }}"
    dest: /tmp/corporativo-app/deploy.log
